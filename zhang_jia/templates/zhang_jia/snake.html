{% extends 'main_app/base.html' %} <!-- 记得替换成你张家实际的 base.html 路径 -->

{% block title %}张家古楼 - 蛇阵迷踪{% endblock %}

{% block content %}
<style>
    /* 张家古楼暗黑主题 */
    .zhang-game-panel {
        background: #1a1a1a; /* 幽暗底色 */
        padding: 30px;
        border: 2px solid #4a5d23; /* 青铜绿边框 */
        box-shadow: 0 0 15px rgba(74, 93, 35, 0.3);
        text-align: center;
        max-width: 500px;
        margin: 0 auto;
        color: #ccc;
    }

    h2 { color: #8fbc8f; letter-spacing: 4px; margin-bottom: 5px; }
    .hint { font-size: 14px; color: #888; margin-bottom: 15px; }

    /* 游戏信息栏 */
    .game-info {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
        font-family: monospace;
        font-size: 16px;
        color: #a9a9a9;
    }
    .best-score { color: #d4af37; } /* 金色高亮 */

    /* 游戏画布 */
        /* 游戏画布 - 强制修正版 */
    #snake-board {
        background-color: #0d0d0d;
        border: 3px solid #4a5d23;
        display: block !important;       /* 强制显示为块级元素 */
        margin: 20px auto !important;    /* 强制居中并留出间距 */
        box-shadow: inset 0 0 20px rgba(0,0,0,0.8);

        /* 【关键修改】强制指定宽高，防止被父容器挤压成 0 */
        width: 400px !important;
        height: 400px !important;
        max-width: 100%;                 /* 手机端自适应 */
    }

    .controls { margin-top: 20px; }
    .btn-zhang {
        background-color: #4a5d23;
        color: #fff;
        border: none;
        padding: 10px 30px;
        font-size: 16px;
        cursor: pointer;
        font-family: inherit;
        letter-spacing: 2px;
        transition: 0.3s;
    }
    .btn-zhang:hover { background-color: #6b8e23; }
</style>

<div class="zhang-game-panel">
    <h2>贪吃野鸡脖子</h2>
    <p class="hint">方向键 / WASD 控制机关蛇，吞噬信物，切勿撞墙或咬尾。</p>

    <div class="game-info">
        <span id="score-display">当前: 0</span>
        <span class="best-score">历史最高: {{ best_score }}</span>
    </div>

    <!-- 使用 Canvas 绘制贪吃蛇 -->
    <canvas id="snake-board" width="400" height="400"></canvas>

    <div class="controls">
        <button onclick="startGame()" class="btn-zhang" id="start-btn">开启机关</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('snake-board');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score-display');
    const startBtn = document.getElementById('start-btn');

    const gridSize = 20; // 格子大小
    const tileCount = canvas.width / gridSize; // 20x20 的网格

    let snake = [];
    let food = {};
    let dx = 0; // x轴速度
    let dy = 0; // y轴速度
    let score = 0;
    let gameLoop;
    let isGameRunning = false;

    // 初始化游戏
    function startGame() {
        clearInterval(gameLoop);
        snake = [{x: 10, y: 10}]; // 蛇的初始位置
        dx = 1; dy = 0;
        score = 0;
        scoreEl.innerText = "当前: 0";
        placeFood();
        isGameRunning = true;
        startBtn.innerText = "重置机关";
        gameLoop = setInterval(update, 200); // 100毫秒刷新一次
    }

    // 放置食物（张家信物）
    function placeFood() {
        food = {
            x: Math.floor(Math.random() * tileCount),
            y: Math.floor(Math.random() * tileCount)
        };
        // 防止食物生成在蛇身上
        for (let segment of snake) {
            if (segment.x === food.x && segment.y === food.y) {
                placeFood();
                return;
            }
        }
    }

    // 游戏主循环
    function update() {
        if (!isGameRunning) return;

        // 1. 移动蛇头
        const head = {x: snake[0].x + dx, y: snake[0].y + dy};

        // 2. 撞墙检测
        if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
            return gameOver();
        }

        // 3. 撞自己检测
        for (let segment of snake) {
            if (head.x === segment.x && head.y === segment.y) {
                return gameOver();
            }
        }

        snake.unshift(head); // 将新头部加入数组

        // 4. 吃到食物
        if (head.x === food.x && head.y === food.y) {
            score += 10;
            scoreEl.innerText = `当前: ${score}`;
            placeFood();
        } else {
            snake.pop(); // 没吃到食物，移除尾巴
        }

        draw();
    }

    // 绘制画面
    function draw() {
        // 清空画布
        ctx.fillStyle = '#0d0d0d';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 画蛇 (青铜色)
        ctx.fillStyle = '#6b8e23';
        for (let segment of snake) {
            ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 1, gridSize - 1);
        }
        // 蛇头高亮
        ctx.fillStyle = '#8fbc8f';
        ctx.fillRect(snake[0].x * gridSize, snake[0].y * gridSize, gridSize - 1, gridSize - 1);

        // 画食物 (金色信物)
        ctx.fillStyle = '#d4af37';
        ctx.beginPath();
        ctx.arc(
            food.x * gridSize + gridSize / 2,
            food.y * gridSize + gridSize / 2,
            gridSize / 2 - 2, 0, Math.PI * 2
        );
        ctx.fill();
    }

    // 游戏结束
    function gameOver() {
        isGameRunning = false;
        clearInterval(gameLoop);
        alert(`机关触发！\n你的得分: ${score}`);
        
        // 提交成绩
        fetch("{% url 'zhang_jia:api_snake_action' %}", { // 确保这里的 app_name 是 zhang_jia
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({ action: 'submit_score', score: score })
        }).then(res => res.json())
          .then(data => console.log(data.message));
    }

    // 键盘控制
    document.addEventListener('keydown', e => {
        if (!isGameRunning) return;
        switch(e.key) {
            case 'ArrowUp': case 'w': case 'W': if (dy === 0) { dx = 0; dy = -1; } break;
            case 'ArrowDown': case 's': case 'S': if (dy === 0) { dx = 0; dy = 1; } break;
            case 'ArrowLeft': case 'a': case 'A': if (dx === 0) { dx = -1; dy = 0; } break;
            case 'ArrowRight': case 'd': case 'D': if (dx === 0) { dx = 1; dy = 0; } break;
        }
    });

    // 初始绘制一个空画布
    ctx.fillStyle = '#0d0d0d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
</script>
{% endblock %}
