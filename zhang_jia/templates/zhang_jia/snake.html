{% extends 'main_app/base.html' %}

{% block title %}古楼第二层 - 贪吃野鸡脖子{% endblock %}

{% block content %}
<style>
    /* --- 基础样式保持不变 --- */
    .zhang-game-panel {
        background: #1a1a1a;
        padding: 30px;
        border: 2px solid #4a5d23;
        box-shadow: 0 0 15px rgba(74, 93, 35, 0.3);
        text-align: center;
        max-width: 700px;
        margin: 0 auto;
        color: #ccc;
        position: relative; /* 为遮罩层定位做准备 */
    }
    h2 { color: #8fbc8f; letter-spacing: 4px; margin-bottom: 5px; }
    .hint { font-size: 14px; color: #888; margin-bottom: 15px; }
    .game-info { display: flex; justify-content: space-between; margin-bottom: 10px; font-family: monospace; font-size: 16px; color: #a9a9a9; }
    .best-score { color: #d4af37; }
    
    #snake-board {
        background-color: #0d0d0d;
        border: 3px solid #4a5d23;
        display: block !important;
        margin: 20px auto !important;
        box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        width: 600px !important;
        height: 600px !important;
        max-width: 100%;
        height: auto;
        aspect-ratio: 1 / 1;
    }
    .controls { margin-top: 20px; display: flex; justify-content: center; gap: 20px; }
    .btn-zhang {
        background-color: #4a5d23;
        color: #fff;
        border: none;
        padding: 10px 30px;
        font-size: 16px;
        cursor: pointer;
        font-family: inherit;
        letter-spacing: 2px;
        transition: 0.3s;
    }
    .btn-zhang:hover { background-color: #6b8e23; }
    .btn-zhang:disabled { background-color: #333; color: #666; cursor: not-allowed; }

    /* --- 新增：大厅选择界面的样式 --- */
    #lobby-overlay {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(13, 13, 13, 0.95);
        z-index: 20;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        border: 2px solid #4a5d23;
    }
    .lobby-box {
        text-align: center;
        animation: fadeIn 0.5s;
    }
    .lobby-title { font-size: 24px; color: #d4af37; margin-bottom: 30px; border-bottom: 1px solid #4a5d23; padding-bottom: 10px; }
    .mode-select, .role-select { margin-bottom: 20px; }
    .select-btn {
        background: transparent;
        border: 1px solid #6b8e23;
        color: #8fbc8f;
        padding: 10px 20px;
        margin: 0 10px;
        cursor: pointer;
        transition: all 0.2s;
    }
    .select-btn:hover, .select-btn.active {
        background: #4a5d23;
        color: white;
        box-shadow: 0 0 10px #4a5d23;
    }
    #start-multi-btn { margin-top: 20px; background-color: #d4af37; color: #000; font-weight: bold; }
    #start-multi-btn:hover { background-color: #ffd700; }

    /* --- 新增：游戏结束面板样式 --- */
    #game-over-overlay {
        display: none; /* 默认隐藏 */
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.85);
        z-index: 150;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }
    .game-over-box {
        background: #1a1a1a;
        padding: 40px;
        border: 2px solid #d4af37;
        text-align: center;
        border-radius: 8px;
        box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
    }
    .game-over-title { color: #d4af37; margin-bottom: 20px; font-size: 28px; }
    .game-over-msg { color: #ccc; margin-bottom: 30px; font-size: 18px; }
    .game-over-btns { display: flex; gap: 20px; justify-content: center; }
    .btn-restart { background: #4a5d23; color: white; border: none; padding: 10px 25px; cursor: pointer; font-size: 16px; }
    .btn-quit { background: #333; color: #888; border: 1px solid #555; padding: 10px 25px; cursor: pointer; font-size: 16px; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
</style>

<div class="zhang-game-panel">
    <h2>贪吃野鸡脖子</h2>
    <a href="/zhang_jia/gu_lou/" class="back-link" style="color:#666; font-size:12px;">← 返回张家古楼入口</a>
    <p class="hint">方向键 / WASD 控制机关蛇，吞噬信物，切勿撞墙或咬尾。</p>

    <!-- 游戏信息栏 -->
    <div class="game-info">
        <span id="score-display">当前: 0</span>
        <span class="best-score">历史最高: {{ best_score }}</span>
        <span id="room-status" style="display:none; color: #6b8e23;">[联机中]</span>
    </div>

    <!-- 游戏画布容器 -->
    <div style="position: relative;">
        <canvas id="snake-board" width="600" height="600" tabIndex="1000"></canvas>

        <!-- ========================================== -->
        <!-- 1. 游戏大厅遮罩层 -->
        <!-- ========================================== -->
        <div id="lobby-overlay">
            <div class="lobby-box" style="text-align: center; border: 2px solid #4a5d23; padding: 40px; background: #1a1a1a; box-shadow: 0 0 20px #4a5d23; width: 400px; max-width: 90%;">
                <h2 style="color: #8fbc8f; margin-bottom: 30px; font-family: 'Microsoft YaHei', sans-serif;">选择历练模式</h2>
                
                <!-- 模式选择 -->
                <div class="mode-select">
                    <button id="btn-mode-single" class="select-btn active" onclick="setMode('single')">🎮 单机历练</button>
                    <button id="btn-mode-multi" class="select-btn" onclick="setMode('multi')">🌐 多人联机</button>
                </div>

                <!-- 联机设置 -->
                <div id="multi-settings" style="display: none; margin-bottom: 20px; border-top: 1px dashed #444; padding-top: 20px;">
                    <div style="margin-bottom: 15px;">
                        <input type="text" id="room-input" placeholder="输入房间号 (如: 888)" style="padding: 8px; width: 60%; background: #000; border: 1px solid #4a5d23; color: #fff; text-align: center;">
                    </div>
                    <div style="display: flex; justify-content: center; gap: 10px; margin-bottom: 20px;">
                        <div id="room-error" style="color: #4ade80; margin: 10px 0; font-size: 14px; min-height: 20px;"></div>
                        <button onclick="createRoom()" style="padding: 5px 15px; background: #4a5d23; color: white; border: none; cursor: pointer;">➕ 创建房间</button>
                        <button onclick="joinRoom()" style="padding: 5px 15px; background: #2c3e50; color: white; border: 1px solid #4a5d23; cursor: pointer;">🚪 加入房间</button>
                    </div>
                    <!-- 关键：在 onclick 里先调用 canvas.focus()，再调用 confirmStart() -->
                    <button id="start-game-btn" class="btn-zhang" onclick="document.getElementById('snake-board').focus(); confirmStart();">开启机关</button>
                </div>
            </div>
            <!-- 单机模式开始按钮 -->
            <button id="start-single-btn" class="btn-zhang" onclick="confirmStart()" style="margin-top:20px;">开启机关</button>
        </div>

        <!-- ========================================== -->
        <!-- 2. 游戏结束遮罩层 (新增) -->
        <!-- ========================================== -->
        <div id="game-over-overlay">
            <div class="game-over-box">
                <h2 id="game-over-title" class="game-over-title">游戏结束</h2>
                <p id="game-over-msg" class="game-over-msg">你的蛇撞墙了！</p>
                <div class="game-over-btns">
                    <button onclick="restartGame()" class="btn-restart">🔄 再来一局</button>
                    <button onclick="quitToLobby()" class="btn-quit">🏠 退出大厅</button>
                </div>
            </div>
        </div>

    </div>

    <!-- 底部控制栏 -->
    <div class="controls">
        <button onclick="togglePause()" class="btn-zhang btn-pause" id="pause-btn" disabled>暂停机关</button>
    </div>
</div>

<script>
// ==========================================
// 1. 全局变量与配置
// ==========================================
const canvas = document.getElementById('snake-board');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score-display');
const lobbyOverlay = document.getElementById('lobby-overlay');
const gameOverOverlay = document.getElementById('game-over-overlay');
const roomStatusEl = document.getElementById('room-status');
const pauseBtn = document.getElementById('pause-btn');
const gridSize = 20;
const tileCount = canvas.width / gridSize; // 30x30 网格

let gameMode = 'single';
let socket = null;
let myPlayerId = null; // 【关键】用于标识自己的蛇
let currentRoomName = null;

// 单机变量
let snake = [];
let food = {};
let dx = 0, dy = 0;
let score = 0;
let gameLoop;
let isGameRunning = false;
let isPaused = false;

// 联机变量
let multiGameState = { snakes: [], foods: [] };

// ==========================================
// 2. 大厅交互逻辑
// ==========================================
function setMode(mode) {
    gameMode = mode;
    document.getElementById('btn-mode-single').className = mode === 'single' ? 'select-btn active' : 'select-btn';
    document.getElementById('btn-mode-multi').className = mode === 'multi' ? 'select-btn active' : 'select-btn';
    const multiSettings = document.getElementById('multi-settings');
    const singleBtn = document.getElementById('start-single-btn');
    if (mode === 'multi') {
        multiSettings.style.display = 'block';
        singleBtn.style.display = 'none';
    } else {
        multiSettings.style.display = 'none';
        singleBtn.style.display = 'inline-block';
    }
}

function createRoom() {
    const roomName = Math.floor(1000 + Math.random() * 9000).toString();
    document.getElementById('room-input').value = roomName;
    currentRoomName = roomName;
    document.getElementById('room-error').innerText = `✅ 房间 ${roomName} 已创建`;
}

function joinRoom() {
    const inputVal = document.getElementById('room-input').value.trim();
    if (!inputVal) {
        document.getElementById('room-error').innerText = "⚠️ 请输入房间号！";
        return;
    }
    currentRoomName = inputVal;
    document.getElementById('room-error').innerText = `✅ 准备加入 ${inputVal}`;
}

function confirmStart() {
    lobbyOverlay.style.display = 'none';
    gameOverOverlay.style.display = 'none'; // 确保结束面板隐藏
    scoreEl.innerText = "当前: 0";
    canvas.focus();
    if (gameMode === 'single') {
        roomStatusEl.style.display = 'none';
        initSinglePlayer();
    } else {
        roomStatusEl.style.display = 'inline';
        roomStatusEl.innerText = `[房间: ${currentRoomName}]`;
        initMultiPlayer();
    }
}

// ==========================================
// 3. 单机模式逻辑
// ==========================================
function initSinglePlayer() {
    snake = [{x: 10, y: 10}];
    dx = 1; dy = 0;
    score = 0;
    isGameRunning = true;
    isPaused = false;
    pauseBtn.disabled = false;
    placeFood();
    if(gameLoop) clearInterval(gameLoop);
    gameLoop = setInterval(updateSinglePlayer, 150);
}

function updateSinglePlayer() {
    if (!isGameRunning || isPaused) return;
    const head = {x: snake[0].x + dx, y: snake[0].y + dy};
    // 撞墙或撞自己
    if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount || snake.some(s => s.x === head.x && s.y === head.y)) {
        return gameOverSingle();
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.innerText = `当前: ${score}`;
        placeFood();
    } else {
        snake.pop();
    }
    drawSinglePlayer();
}

function drawSinglePlayer() {
    ctx.fillStyle = '#0d0d0d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // 画食物
    ctx.fillStyle = '#d4af37';
    ctx.beginPath();
    ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI*2);
    ctx.fill();
    // 画蛇 (单机模式默认高亮)
    snake.forEach((seg, index) => {
        ctx.fillStyle = index === 0 ? '#8fbc8f' : '#4a5d23';
        ctx.fillRect(seg.x * gridSize, seg.y * gridSize, gridSize - 2, gridSize - 2);
    });
}

function placeFood() {
    food = { x: Math.floor(Math.random() * tileCount), y: Math.floor(Math.random() * tileCount) };
    for(let s of snake) {
        if(s.x === food.x && s.y === food.y) placeFood();
    }
}

function togglePause() {
    if(gameMode !== 'single' || !isGameRunning) return;
    isPaused = !isPaused;
    pauseBtn.innerText = isPaused ? "继续机关" : "暂停机关";
}

function gameOverSingle() {
    isGameRunning = false;
    clearInterval(gameLoop);
    
    // --- 新增：单机模式保存最高分逻辑 ---
    const bestScoreEl = document.querySelector('.best-score');
    const currentBestScoreText = bestScoreEl ? bestScoreEl.innerText.split(': ')[1] : '0';
    const currentBestScore = parseInt(currentBestScoreText) || 0;

    if (score > currentBestScore) {
        fetch('/zhang_jia/api/snake_action/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken'),
            },
            body: JSON.stringify({ action: 'submit_score', score: score })
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success' && bestScoreEl) {
                bestScoreEl.innerText = `历史最高: ${score}`;
            }
        })
        .catch(error => console.error('保存分数失败:', error));
    }
    // --- 逻辑结束 ---

    showGameOverPanel(`单机模式结束！得分: ${score}`);
}

// ==========================================
// 4. 联机模式逻辑
// ==========================================

function initMultiPlayer() {
    isGameRunning = false;
    isPaused = false;
    myPlayerId = null;
    const wsProtocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
    socket = new WebSocket(wsProtocol + window.location.host + '/ws/snake/' + currentRoomName + '/');
    socket.onopen = function(e) {
        console.log("✅ 已连接到联机战场");
        isGameRunning = true;
        canvas.focus();
    };
    socket.onmessage = function(e) {
        const data = JSON.parse(e.data);
        if (data.type === 'update_game') {
            isGameRunning = true;
            multiGameState.snakes = data.snakes;
            multiGameState.foods = data.foods;
            // 【关键】获取自己的ID
            if (data.my_id) {
                myPlayerId = data.my_id;
            }
            drawMultiPlayer();
        }
        if (data.type === 'game_over') {
            showGameOverPanel(data.message);
        }
    };
    socket.onclose = function(e) {
        console.log("❌ 连接断开");
    };
}

function drawMultiPlayer() {
    ctx.fillStyle = '#0d0d0d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // 画食物
    ctx.fillStyle = '#d4af37';
    multiGameState.foods.forEach(f => {
        ctx.beginPath();
        ctx.arc(f.x * gridSize + gridSize/2, f.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI*2);
        ctx.fill();
    });
    // 画蛇
    multiGameState.snakes.forEach(s => {
        // 【核心逻辑】判断是不是自己的蛇
        // 注意：后端传来的 id 可能是数字，myPlayerId 可能是字符串，所以用 == 而不是 ===
        const isMySnake = (s.id == myPlayerId);
        // 自己的蛇高亮，别人的蛇暗色
        ctx.fillStyle = isMySnake ? '#8fbc8f' : '#4a5d23';
        s.body.forEach(seg => {
            ctx.fillRect(seg.x * gridSize, seg.y * gridSize, gridSize - 2, gridSize - 2);
        });
        // 在自己的蛇头上画个“我”字
        if (isMySnake && s.body.length > 0) {
            ctx.fillStyle = '#fff';
            ctx.font = '12px Arial';
            ctx.fillText("我", s.body[0].x * gridSize, s.body[0].y * gridSize - 5);
        }
    });
}

// ==========================================
// 5. 游戏结束面板逻辑
// ==========================================
function showGameOverPanel(message) {
    isGameRunning = false;
    const overlay = document.getElementById('game-over-overlay');
    const msgEl = document.getElementById('game-over-msg');
    
    // --- 核心改动：处理联机模式的排行榜 ---
    if (gameMode === 'multi' && currentRoomName) {
        msgEl.innerHTML = '游戏结束！正在加载排行榜...';
        overlay.style.display = 'flex';

        // 向后端请求当前房间的排行榜
        fetch(`/zhang_jia/api_snake_leaderboard/?room_name=${currentRoomName}`)
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    let leaderboardHtml = `<h3>房间 ${currentRoomName} 排行榜</h3><ol>`;
                    data.leaderboard.forEach((player, index) => {
                        // 高亮显示自己
                        const isMe = player.username === data.my_username ? 'style="color: #8fbc8f; font-weight: bold;"' : '';
                        leaderboardHtml += `<li ${isMe}>${player.username}: ${player.score} 分</li>`;
                    });
                    leaderboardHtml += `</ol>`;
                    msgEl.innerHTML = leaderboardHtml;
                } else {
                    msgEl.innerText = message || "游戏结束";
                }
            })
            .catch(error => {
                console.error('获取排行榜失败:', error);
                msgEl.innerText = message || "游戏结束";
            });
    } else {
        // 单机模式，保持原样
        msgEl.innerText = message || "游戏结束";
        overlay.style.display = 'flex';
    }
}

function restartGame() {
    const overlay = document.getElementById('game-over-overlay');
    overlay.style.display = 'none'; // 隐藏遮罩
    if (gameMode === 'single') {
        initSinglePlayer(); // 单机：直接重新初始化
    } else {
        // 联机：通知后端重置
        if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ 'type': 'restart' }));
            // 前端状态会在下一次 onmessage 中自动更新
            isGameRunning = true;
        }
    }
}

function quitToLobby() {
    const overlay = document.getElementById('game-over-overlay');
    overlay.style.display = 'none';
    if (gameMode === 'multi' && socket) {
        socket.close(); // 关闭 WebSocket 连接
        socket = null;
    }
    // 清理画布
    ctx.fillStyle = '#0d0d0d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // 回到初始的大厅界面
    lobbyOverlay.style.display = 'flex';
    roomStatusEl.style.display = 'none';
    pauseBtn.disabled = true;
}

document.addEventListener('keydown', function(e) {
    // 防止按键时页面滚动
    if(["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].indexOf(e.code) > -1) {
        e.preventDefault();
    }
    // 如果游戏没在运行，或者暂停了，就不响应方向键
    if (!isGameRunning || isPaused) return;

    // 单机模式控制
    if (gameMode === 'single') {
        if (e.key === 'ArrowUp' || e.key === 'w') {
            if (dy !== 1) { dx = 0; dy = -1; }
        } else if (e.key === 'ArrowDown' || e.key === 's') {
            if (dy !== -1) { dx = 0; dy = 1; }
        } else if (e.key === 'ArrowLeft' || e.key === 'a') {
            if (dx !== 1) { dx = -1; dy = 0; }
        } else if (e.key === 'ArrowRight' || e.key === 'd') {
            if (dx !== -1) { dx = 1; dy = 0; }
        }
    }
    // 联机模式控制
    else if (gameMode === 'multi' && socket && socket.readyState === WebSocket.OPEN) {
        let direction = '';
        if (e.key === 'ArrowUp' || e.key === 'w') direction = 'up';
        else if (e.key === 'ArrowDown' || e.key === 's') direction = 'down';
        else if (e.key === 'ArrowLeft' || e.key === 'a') direction = 'left';
        else if (e.key === 'ArrowRight' || e.key === 'd') direction = 'right';
        if (direction) {
            socket.send(JSON.stringify({ 'type': 'move', 'direction': direction }));
        }
    }
});

// 别忘了页面里需要有获取 CSRF Token 的辅助函数（Django 必备）
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
</script>
{% endblock %}
