{% extends 'main_app/base.html' %}

{% block title %}古楼第二层 - 贪吃野鸡脖子{% endblock %}

{% block content %}
<style>
    /* --- 基础样式保持不变 --- */
    .zhang-game-panel {
        background: #1a1a1a;
        padding: 30px;
        border: 2px solid #4a5d23;
        box-shadow: 0 0 15px rgba(74, 93, 35, 0.3);
        text-align: center;
        max-width: 700px;
        margin: 0 auto;
        color: #ccc;
        position: relative; /* 为遮罩层定位做准备 */
    }

    h2 { color: #8fbc8f; letter-spacing: 4px; margin-bottom: 5px; }
    .hint { font-size: 14px; color: #888; margin-bottom: 15px; }

    .game-info {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
        font-family: monospace;
        font-size: 16px;
        color: #a9a9a9;
    }
    .best-score { color: #d4af37; }

    #snake-board {
        background-color: #0d0d0d;
        border: 3px solid #4a5d23;
        display: block !important;
        margin: 20px auto !important;
        box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        width: 600px !important;
        height: 600px !important;
        max-width: 100%;
        height: auto;
        aspect-ratio: 1 / 1;
    }

    .controls { margin-top: 20px; display: flex; justify-content: center; gap: 20px; }

    .btn-zhang {
        background-color: #4a5d23;
        color: #fff;
        border: none;
        padding: 10px 30px;
        font-size: 16px;
        cursor: pointer;
        font-family: inherit;
        letter-spacing: 2px;
        transition: 0.3s;
    }
    .btn-zhang:hover { background-color: #6b8e23; }
    .btn-zhang:disabled { background-color: #333; color: #666; cursor: not-allowed; }

    /* --- 新增：大厅选择界面的样式 --- */
    #lobby-overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(13, 13, 13, 0.95); /* 深色半透明背景 */
        z-index: 20;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        border: 2px solid #4a5d23;
    }

    .lobby-box {
        text-align: center;
        animation: fadeIn 0.5s;
    }

    .lobby-title {
        font-size: 24px;
        color: #d4af37;
        margin-bottom: 30px;
        border-bottom: 1px solid #4a5d23;
        padding-bottom: 10px;
    }

    .mode-select, .role-select {
        margin-bottom: 20px;
    }

    .select-btn {
        background: transparent;
        border: 1px solid #6b8e23;
        color: #8fbc8f;
        padding: 10px 20px;
        margin: 0 10px;
        cursor: pointer;
        transition: all 0.2s;
    }

    .select-btn:hover, .select-btn.active {
        background: #4a5d23;
        color: white;
        box-shadow: 0 0 10px #4a5d23;
    }

    #start-multi-btn {
        margin-top: 20px;
        background-color: #d4af37;
        color: #000;
        font-weight: bold;
    }
    #start-multi-btn:hover { background-color: #ffd700; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
</style>

<div class="zhang-game-panel">
    <h2>贪吃野鸡脖子</h2>
    <a href="/zhang_jia/gu_lou/" class="back-link" style="color:#666; font-size:12px;">← 返回张家古楼入口</a>
    <p class="hint">方向键 / WASD 控制机关蛇，吞噬信物，切勿撞墙或咬尾。</p>

    <!-- 游戏信息栏 -->
    <div class="game-info">
        <span id="score-display">当前: 0</span>
        <span class="best-score">历史最高: {{ best_score }}</span>
        <span id="room-status" style="display:none; color: #6b8e23;">[联机中]</span>
    </div>

    <!-- 游戏画布容器 -->
    <div style="position: relative;">
        <canvas id="snake-board" width="600" height="600"></canvas>

        <!-- ========================================== -->
<!-- 【最终版】游戏大厅遮罩层 (包含房间系统) -->
<!-- ========================================== -->
<div id="lobby-overlay" style="position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 100; display: flex; justify-content: center; align-items: center; flex-direction: column;">
    
    <!-- 这里的 lobby-box 宽度加到了 400px，防止输入框太挤 -->
    <div class="lobby-box" style="text-align: center; border: 2px solid #4a5d23; padding: 40px; background: #1a1a1a; box-shadow: 0 0 20px #4a5d23; width: 400px; max-width: 90%;">
        
        <h2 style="color: #8fbc8f; margin-bottom: 30px; font-family: 'Microsoft YaHei', sans-serif;">选择历练模式</h2>

        <!-- 1. 模式选择 -->
        <div class="mode-select" style="margin-bottom: 20px;">
            <button id="btn-mode-single" class="select-btn active" onclick="setMode('single')" style="padding: 10px 20px; margin: 0 5px; cursor: pointer; background: #2c3e50; color: white; border: 1px solid #4a5d23;">🎮 单机历练</button>
            <button id="btn-mode-multi" class="select-btn" onclick="setMode('multi')" style="padding: 10px 20px; margin: 0 5px; cursor: pointer; background: #2c3e50; color: #888; border: 1px solid #4a5d23;">🌐 多人联机</button>
        </div>

        <!-- 2. 联机专属设置 (默认隐藏) -->
        <div id="multi-settings" style="display: none; margin-bottom: 20px; border-top: 1px dashed #444; padding-top: 20px;">
            
            <!-- 房间操作区 -->
            <div style="margin-bottom: 15px;">
                <input type="text" id="room-input" placeholder="输入房间号 (如: 888)" style="padding: 8px; width: 60%; background: #000; border: 1px solid #4a5d23; color: #fff; text-align: center;">
            </div>
            
            <div style="display: flex; justify-content: center; gap: 10px; margin-bottom: 20px;">
                <button onclick="createRoom()" style="padding: 5px 15px; background: #4a5d23; color: white; border: none; cursor: pointer;">➕ 创建房间</button>
                <button onclick="joinRoom()" style="padding: 5px 15px; background: #2c3e50; color: white; border: 1px solid #4a5d23; cursor: pointer;">🚪 加入房间</button>
            </div>

            <!-- 角色选择 -->
            <p style="font-size: 12px; color: #888; margin-bottom: 10px;">选择你的化身：</p>
            <div>
                <button id="btn-role-snake" class="select-btn active" onclick="setRole('snake')" style="padding: 8px 15px; margin: 0 5px; background: #2c3e50; color: white; border: 1px solid #4a5d23;">🐍 成为蛇</button>
                <button id="btn-role-food" class="select-btn" onclick="setRole('food')" style="padding: 8px 15px; margin: 0 5px; background: #2c3e50; color: #888; border: 1px solid #4a5d23;">🍎 成为信物</button>
            </div>
        </div>

        <!-- 3. 开启按钮 -->
        <button id="start-game-btn" class="btn-zhang" onclick="confirmStart()" style="margin-top: 10px; padding: 12px 40px; background: #4a5d23; color: white; border: none; font-size: 16px; cursor: pointer; font-weight: bold;">开启机关</button>
    </div>
</div>


        <!-- 单机模式专属开始按钮 -->
        <button id="start-single-btn" class="btn-zhang" onclick="confirmStart()" style="margin-top:20px;">开启机关</button>
    </div>
</div>
        </div>
    </div>

    <!-- 底部控制栏 (仅在单机模式游戏中有用) -->
    <div class="controls">
        <button onclick="togglePause()" class="btn-zhang btn-pause" id="pause-btn" disabled>暂停机关</button>
    </div>
</div>

<script>
    // ==========================================
// 1. 全局变量与配置
// ==========================================
const canvas = document.getElementById('snake-board');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score-display');
const lobbyOverlay = document.getElementById('lobby-overlay');
const roomStatusEl = document.getElementById('room-status');
const pauseBtn = document.getElementById('pause-btn');
const startGameBtn = document.getElementById('start-game-btn');

// 游戏参数
const gridSize = 20;
const tileCount = canvas.width / gridSize; // 30x30 网格

// 状态变量
let gameMode = 'single'; // 'single' or 'multi'
let playerRole = 'snake'; // 'snake' or 'food' (for multi)
let roomRoles = new Set(); // 新增：用来记录房间里已有的角色类型
let socket = null;
let myPlayerId = null; // 联机时记录自己的ID

// 单机模式变量
let snake = [];
let food = {};
let dx = 0, dy = 0;
let score = 0;
let gameLoop;
let isGameRunning = false;
let isPaused = false;

// 联机模式变量
let multiGameState = {
    snakes: [], // [{id: 1, body: [{x,y},...], color: 'green'}, ...]
    foods: []   // [{x, y}, ...]
};

// ==========================================
// 2. 大厅交互逻辑 (UI部分)
// ==========================================
let currentRoomName = null; // 记录当前加入的房间号
let ws = null;

function setMode(mode) {
    gameMode = mode;
    document.getElementById('btn-mode-single').className = mode === 'single' ? 'select-btn active' : 'select-btn';
    document.getElementById('btn-mode-multi').className = mode === 'multi' ? 'select-btn active' : 'select-btn';
    const multiSettings = document.getElementById('multi-settings');
    const singleBtn = document.getElementById('start-single-btn');
    const errorEl = document.getElementById('room-error');
    if (mode === 'multi') {
        multiSettings.style.display = 'block';
        singleBtn.style.display = 'none'; // 联机模式隐藏单机开始按钮
        errorEl.innerText = ''; // 清除错误提示
    } else {
        multiSettings.style.display = 'none';
        singleBtn.style.display = 'inline-block'; // 单机模式显示开始按钮
    }
}

function setRole(role) {
    playerRole = role;
    document.getElementById('btn-role-snake').className = role === 'snake' ? 'select-btn active' : 'select-btn';
    document.getElementById('btn-role-food').className = role === 'food' ? 'select-btn active' : 'select-btn';
}

// 创建房间：自动生成一个 4 位随机数，并自动加入
function createRoom() {
    const roomName = Math.floor(1000 + Math.random() * 9000).toString();
    document.getElementById('room-input').value = roomName;
    currentRoomName = roomName;
    document.getElementById('room-error').innerText = `✅ 房间 ${roomName} 已创建，正在进入...`;
    // 延迟 0.5 秒让玩家看到提示，然后开始游戏
    setTimeout(() => confirmStart(), 500);
}

// 加入房间：校验输入是否为空
function joinRoom() {
    const inputVal = document.getElementById('room-input').value.trim();
    const errorEl = document.getElementById('room-error');
    if (!inputVal) {
        errorEl.innerText = "⚠️ 请输入房间号！";
        return;
    }
    currentRoomName = inputVal;
    errorEl.innerText = `✅ 正在加入房间 ${inputVal}...`;
    setTimeout(() => confirmStart(), 500);
}

// 确认开始游戏 (单机/联机统一入口)
function confirmStart() {
    // --- 新增：联机模式开始前的检查 ---
    if (gameMode === 'multi') {
        // 如果房间里还没有玩家信息，先请求一次
        if (roomRoles.size === 0 && socket && socket.readyState === WebSocket.OPEN) {
             socket.send(JSON.stringify({'type': 'get_player_list'}));
             // 稍等一下再检查，给服务器一点反应时间
             setTimeout(confirmStart, 500);
             return;
        }

        // 检查是否同时存在蛇和信物
        if (!roomRoles.has('snake') || !roomRoles.has('food')) {
            alert("⚠️ 游戏无法开始！房间里必须至少有一位玩家选择【成为蛇】，也至少有一位玩家选择【成为信物】。");
            return; // 中断函数，不开始游戏
        }
    }

    // --- 原有的开始游戏逻辑保持不变 ---
    lobbyOverlay.style.display = 'none';
    scoreEl.innerText = "当前: 0";
    if (gameMode === 'single') {
        roomStatusEl.style.display = 'none';
        initSinglePlayer();
    } else {
        roomStatusEl.style.display = 'inline';
        roomStatusEl.innerText = `[房间: ${currentRoomName}]`;
        initMultiPlayer(); // 注意：这里会重新建立连接，onopen 会再次发送 join_game
    }
}

// ==========================================
// 3. 单机模式逻辑 (保留原有功能)
// ==========================================
function initSinglePlayer() {
    snake = [{x: 10, y: 10}];
    dx = 1; dy = 0;
    score = 0;
    isGameRunning = true;
    isPaused = false;
    pauseBtn.disabled = false;
    pauseBtn.innerText = "暂停机关";
    pauseBtn.classList.remove('active');
    placeFood();
    if(gameLoop) clearInterval(gameLoop);
    gameLoop = setInterval(updateSinglePlayer, 150);
}

function updateSinglePlayer() {
    if (!isGameRunning || isPaused) return;
    const head = {x: snake[0].x + dx, y: snake[0].y + dy};
    // 撞墙检测
    if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        return gameOverSingle();
    }
    // 撞自己
    for (let segment of snake) {
        if (head.x === segment.x && head.y === segment.y) {
            return gameOverSingle();
        }
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.innerText = `当前: ${score}`;
        placeFood();
    } else {
        snake.pop();
    }
    drawSinglePlayer();
}

function drawSinglePlayer() {
    ctx.fillStyle = '#0d0d0d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // 画食物
    ctx.fillStyle = '#d4af37';
    ctx.beginPath();
    ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI*2);
    ctx.fill();
    // 画蛇
    snake.forEach((seg, index) => {
        ctx.fillStyle = index === 0 ? '#8fbc8f' : '#4a5d23';
        ctx.fillRect(seg.x * gridSize, seg.y * gridSize, gridSize - 2, gridSize - 2);
    });
}

function placeFood() {
    food = { x: Math.floor(Math.random() * tileCount), y: Math.floor(Math.random() * tileCount) };
    for(let s of snake) {
        if(s.x === food.x && s.y === food.y) placeFood();
    }
}

function togglePause() {
    if(gameMode !== 'single' || !isGameRunning) return;
    isPaused = !isPaused;
    pauseBtn.innerText = isPaused ? "继续机关" : "暂停机关";
    pauseBtn.classList.toggle('active');
}

function gameOverSingle() {
    isGameRunning = false;
    clearInterval(gameLoop);
    alert(`单机模式结束！得分: ${score}`);
    lobbyOverlay.style.display = 'flex';
}

// ==========================================
// 4. 联机模式逻辑 (WebSocket)
// ==========================================
function initMultiPlayer() {
    // 【修改】使用刚才获取的房间号
    const wsProtocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
    socket = new WebSocket(wsProtocol + window.location.host + '/ws/snake/' + currentRoomName + '/');

    socket.onopen = function(e) {
        console.log("✅ 已连接到联机战场，房间号:", currentRoomName);
        // 【修改】发送加入指令时，顺便把玩家身份带上
        const username = "{{ user.username }}" || "Guest";
        socket.send(JSON.stringify({
            'type': 'join_game',
            'role': playerRole,
            'username': username // 把账号名传给后端！
        }));
    };

    // ... 后面的 onmessage 和 onclose 保持不变
    socket.onmessage = function(e) {
        const data = JSON.parse(e.data);
        
        // --- 新增：监听服务器发来的玩家列表 ---
        if (data.type === 'player_list') {
            roomRoles = new Set(data.roles);
            console.log("当前房间角色:", roomRoles);
        }

        if (data.type === 'game_state') {
            multiGameState.snakes = data.snakes;
            multiGameState.foods = data.foods;
            myPlayerId = data.my_id; // 记录自己的ID，用于高亮
            drawMultiPlayer();
        }
        if (data.type === 'player_died') {
            alert(data.message);
            lobbyOverlay.style.display = 'flex';
            socket.close();
        }
    };

    socket.onclose = function(e) {
        console.error('❌ 联机断开');
    };
}

function drawMultiPlayer() {
    ctx.fillStyle = '#0d0d0d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // 画所有食物
    ctx.fillStyle = '#d4af37';
    multiGameState.foods.forEach(f => {
        ctx.beginPath();
        ctx.arc(f.x * gridSize + gridSize/2, f.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI*2);
        ctx.fill();
    });
    // 画所有蛇
    multiGameState.snakes.forEach(s => {
        // 如果是自己，颜色高亮
        ctx.fillStyle = (s.id === myPlayerId) ? '#8fbc8f' : '#4a5d23';
        s.body.forEach(seg => {
            ctx.fillRect(seg.x * gridSize, seg.y * gridSize, gridSize - 2, gridSize - 2);
        });
    });
}

// ==========================================
// 5. 统一的键盘监听 (核心)
// ==========================================
document.addEventListener('keydown', e => {
    // 如果在暂停状态，不处理
    if (isPaused) return;
    
    let newDx = dx, newDy = dy;
    let moved = false;
    switch(e.key) {
        case 'ArrowUp': case 'w': case 'W':
            if (dy === 0) { newDx = 0; newDy = -1; moved = true; }
            break;
        case 'ArrowDown': case 's': case 'S':
            if (dy === 0) { newDx = 0; newDy = 1; moved = true; }
            break;
        case 'ArrowLeft': case 'a': case 'A':
            if (dx === 0) { newDx = -1; newDy = 0; moved = true; }
            break;
        case 'ArrowRight': case 'd': case 'D':
            if (dx === 0) { newDx = 1; newDy = 0; moved = true; }
            break;
    }
    if (!moved) return;

    // 单机模式：直接修改本地变量
    if (gameMode === 'single' && isGameRunning) {
        dx = newDx; dy = newDy;
    }

    // --- 修改：联机模式，无论是蛇还是信物，都可以发送移动指令 ---
    if (gameMode === 'multi' && socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({
            'type': 'move',
            // 告诉服务器，这是哪个角色在移动
            'role': playerRole, 
            'direction': newDx === 0 ? (newDy === -1 ? 'up' : 'down') : (newDx === -1 ? 'left' : 'right')
        }));
    }
});

// 初始绘制黑底
ctx.fillStyle = '#0d0d0d';
ctx.fillRect(0, 0, canvas.width, canvas.height);
</script>
{% endblock %}
