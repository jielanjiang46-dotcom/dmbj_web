{% extends 'main_app/base.html' %}

{% block title %}张家古楼 - 蛇阵迷踪{% endblock %}

{% block content %}
<style>
    /* 张家古楼暗黑主题 */
    .zhang-game-panel {
        background: #1a1a1a;
        padding: 30px;
        border: 2px solid #4a5d23;
        box-shadow: 0 0 15px rgba(74, 93, 35, 0.3);
        text-align: center;
        max-width: 700px; /* 稍微放宽一点容器，容纳更大的画布 */
        margin: 0 auto;
        color: #ccc;
    }

    h2 { color: #8fbc8f; letter-spacing: 4px; margin-bottom: 5px; }
    .hint { font-size: 14px; color: #888; margin-bottom: 15px; }

    /* 游戏信息栏 */
    .game-info {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
        font-family: monospace;
        font-size: 16px;
        color: #a9a9a9;
    }
    .best-score { color: #d4af37; }

    /* 游戏画布 - 放大版 */
    #snake-board {
        background-color: #0d0d0d;
        border: 3px solid #4a5d23;
        display: block !important;
        margin: 20px auto !important;
        box-shadow: inset 0 0 20px rgba(0,0,0,0.8);

        /* 【关键修改】强制指定宽高为 600 */
        width: 400px !important;
        height: 400px !important;

        /* 手机端自适应：如果屏幕小于600px，就自动缩小 */
        max-width: 100%;
        height: auto;
        aspect-ratio: 1 / 1;
    }

    .controls { margin-top: 20px; display: flex; justify-content: center; gap: 20px; }

    .btn-zhang {
        background-color: #4a5d23;
        color: #fff;
        border: none;
        padding: 10px 30px;
        font-size: 16px;
        cursor: pointer;
        font-family: inherit;
        letter-spacing: 2px;
        transition: 0.3s;
    }
    .btn-zhang:hover { background-color: #6b8e23; }

    /* 暂停按钮的特殊样式 */
    .btn-pause {
        background-color: #555; /* 默认灰色 */
    }
    .btn-pause:hover { background-color: #777; }
    .btn-pause.active {
        background-color: #d4af37; /* 激活时变成金色 */
        color: #000;
    }
</style>

<div class="zhang-game-panel">
    <h2>贪吃野鸡脖子</h2>
    <a href="/zhang_jia/gu_lou/" class="back-link">← 返回张家古楼入口</a>
    <p class="hint">方向键 / WASD 控制机关蛇，吞噬信物，切勿撞墙或咬尾。</p>

    <div class="game-info">
        <span id="score-display">当前: 0</span>
        <span class="best-score">历史最高: {{ best_score }}</span>
    </div>

    <!-- 使用 Canvas 绘制贪吃蛇 -->
    <!-- 【关键修改】这里改成 600x600 -->
    <canvas id="snake-board" width="600" height="600"></canvas>

    <div class="controls">
        <button onclick="startGame()" class="btn-zhang" id="start-btn">开启机关</button>
        <!-- 【新增】暂停按钮 -->
        <button onclick="togglePause()" class="btn-zhang btn-pause" id="pause-btn" disabled>暂停机关</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('snake-board');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score-display');
    const startBtn = document.getElementById('start-btn');
    const pauseBtn = document.getElementById('pause-btn'); // 获取暂停按钮元素

    const gridSize = 20; // 格子大小不变
    const tileCount = canvas.width / gridSize; // 自动计算网格数量 (600/20 = 30格)

    let snake = [];
    let food = {};
    let dx = 0;
    let dy = 0;
    let score = 0;
    let gameLoop;
    let isGameRunning = false;
    let isPaused = false; // 【新增】暂停状态标记

    // 初始化游戏
    function startGame() {
        clearInterval(gameLoop);
        snake = [{x: 10, y: 10}];
        dx = 1; dy = 0; // 初始向右移动
        score = 0;
        isPaused = false;
        scoreEl.innerText = "当前: 0";

        // 重置按钮状态
        startBtn.innerText = "重置机关";
        pauseBtn.innerText = "暂停机关";
        pauseBtn.disabled = false;
        pauseBtn.classList.remove('active');

        placeFood();
        isGameRunning = true;

        // 速度保持 200ms
        gameLoop = setInterval(update, 200);
    }

    // 【新增】暂停/继续 切换逻辑
    function togglePause() {
        if (!isGameRunning) return;

        isPaused = !isPaused; // 切换状态

        if (isPaused) {
            // 进入暂停
            clearInterval(gameLoop); // 停止循环
            pauseBtn.innerText = "继续机关";
            pauseBtn.classList.add('active'); // 变金色
        } else {
            // 恢复游戏
            pauseBtn.innerText = "暂停机关";
            pauseBtn.classList.remove('active');
            gameLoop = setInterval(update, 200); // 重新启动循环
        }
    }

    // 放置食物
    function placeFood() {
        food = {
            x: Math.floor(Math.random() * tileCount),
            y: Math.floor(Math.random() * tileCount)
        };
        for (let segment of snake) {
            if (segment.x === food.x && segment.y === food.y) {
                placeFood();
                return;
            }
        }
    }

    // 游戏主循环
    function update() {
        if (!isGameRunning || isPaused) return; // 如果暂停了就不执行更新

        const head = {x: snake[0].x + dx, y: snake[0].y + dy};

        // 撞墙检测
        if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
            return gameOver();
        }

        // 撞自己检测
        for (let segment of snake) {
            if (head.x === segment.x && head.y === segment.y) {
                return gameOver();
            }
        }

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
            score += 10;
            scoreEl.innerText = `当前: ${score}`;
            placeFood();
        } else {
            snake.pop();
        }

        draw();
    }

    // 绘制画面
    function draw() {
        ctx.fillStyle = '#0d0d0d';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 画蛇
        ctx.fillStyle = '#6b8e23';
        for (let segment of snake) {
            ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 1, gridSize - 1);
        }
        // 蛇头高亮
        ctx.fillStyle = '#8fbc8f';
        ctx.fillRect(snake[0].x * gridSize, snake[0].y * gridSize, gridSize - 1, gridSize - 1);

        // 画食物
        ctx.fillStyle = '#d4af37';
        ctx.beginPath();
        ctx.arc(
            food.x * gridSize + gridSize / 2,
            food.y * gridSize + gridSize / 2,
            gridSize / 2 - 2, 0, Math.PI * 2
        );
        ctx.fill();

        // 【新增】如果是暂停状态，在画面上画一个半透明的遮罩和文字
        if (isPaused) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#fff';
            ctx.font = '40px monospace';
            ctx.textAlign = 'center';
            ctx.fillText("机关已冻结", canvas.width / 2, canvas.height / 2);
        }
    }

    // 游戏结束
    function gameOver() {
        isGameRunning = false;
        clearInterval(gameLoop);
        pauseBtn.disabled = true; // 游戏结束禁用暂停按钮
        pauseBtn.classList.remove('active');
        pauseBtn.innerText = "暂停机关";

        alert(`机关触发！\n你的得分: ${score}`);

        fetch("{% url 'zhang_jia:api_snake_action' %}", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({ action: 'submit_score', score: score })
        }).then(res => res.json())
          .then(data => console.log(data.message));
    }

    // 键盘控制
    document.addEventListener('keydown', e => {
        // 如果没开始或者暂停中，禁止操作方向（防止乱按）
        if (!isGameRunning || isPaused) return;

        switch(e.key) {
            case 'ArrowUp': case 'w': case 'W': if (dy === 0) { dx = 0; dy = -1; } break;
            case 'ArrowDown': case 's': case 'S': if (dy === 0) { dx = 0; dy = 1; } break;
            case 'ArrowLeft': case 'a': case 'A': if (dx === 0) { dx = -1; dy = 0; } break;
            case 'ArrowRight': case 'd': case 'D': if (dx === 0) { dx = 1; dy = 0; } break;
        }
    });

    // 初始绘制
    ctx.fillStyle = '#0d0d0d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
</script>
{% endblock %}
