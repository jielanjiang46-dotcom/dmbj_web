{% extends 'main_app/base.html' %}

{% block content %}

  {% if form.errors %}
    <p>你的用户名和密码不匹配，请重试。</p>
  {% endif %}

  <form action="{% url 'accounts:login' %}" method='post'>
    {% csrf_token %}
    {{ form.as_div }}

    <button name="submit">Log in</button>
   </form>

{% endblock content %}
