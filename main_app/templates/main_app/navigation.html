{% extends "main_app/base.html" %}

{% block content %}

<style>
    /* 强制页面高度为视口高度，禁止出现滚动条 */
    .nav-full-screen {
        min-height: 60vh;

        display: flex;
        flex-direction: column;
        justify-content: flex-start; /* 保持靠上对齐 */
        padding-top: 120px;          /* 保持你刚才调整好的顶部距离 */
        align-items: center;
        max-width: 1200px;
        margin: 0 auto;
    }

    /* 头部区域更紧凑 */
    .nav-header-compact {
        text-align: center;
        margin-bottom: 40px; /* 减小下边距 */
    }

    .nav-title {
        font-size: 2.2em;
        color: #e0e0e0;
        margin: 0 0 5px 0;
        letter-spacing: 2px;
    }

    .nav-subtitle {
        font-size: 0.9em;
        color: #666;
        margin: 0;
    }

    /* 网格布局：在大屏幕上横向排列 */
    .portal-grid-compact {
        display: grid;
        grid-template-columns: repeat(4, 1fr); /* 强制分为4列 */
        gap: 30px;
        width: 100%;
    }

    /* 特别篇入口：独立于上方四个主版块 */
    .special-portal {
        width: min(560px, 90%);
        margin-top: 28px;
        padding-top: 18px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .special-card {
        position: relative;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 13px 20px;
        color: #b9c2bb;
        background: rgba(20, 29, 26, 0.72);
        border: 1px solid rgba(105, 133, 119, 0.38);
        border-radius: 4px;
        text-decoration: none;
        overflow: hidden;
        transition: all 0.3s ease;
    }

    .special-card::before {
        content: "SPECIAL FILE";
        position: absolute;
        right: -11px;
        top: 8px;
        padding: 3px 15px;
        color: rgba(153, 177, 165, 0.55);
        border: 1px solid rgba(105, 133, 119, 0.24);
        font-size: 9px;
        letter-spacing: 2px;
        transform: rotate(6deg);
    }

    .special-card:hover {
        color: #e1e9e3;
        background: rgba(31, 46, 40, 0.9);
        border-color: #708f80;
        box-shadow: 0 5px 18px rgba(0, 0, 0, 0.38);
        transform: translateY(-2px);
    }

    .special-icon {
        font-size: 1.55em;
        filter: grayscale(35%);
    }

    .special-copy {
        display: flex;
        flex-direction: column;
        gap: 2px;
    }

    .special-name {
        font-size: 0.98em;
        font-weight: bold;
        letter-spacing: 3px;
    }

    .special-desc {
        color: #718078;
        font-size: 0.72em;
        letter-spacing: 1px;
    }

    /* 如果屏幕太窄（比如手机），自动变为2x2的矩阵 */
    @media (max-width: 900px) {
        .portal-grid-compact {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    /* 单个卡片样式：更小巧 */
    .portal-card-mini {
        background: rgba(30, 30, 30, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 25px 15px;
        text-align: center;
        transition: all 0.3s ease;
        cursor: pointer;
        text-decoration: none; /* 去掉链接下划线 */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    .portal-card-mini:hover {
        background: rgba(50, 50, 50, 0.8);
        transform: translateY(-5px);
        border-color: #d4af37; /* 金色边框高亮 */
        box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }

    .card-icon {
        font-size: 2.5em;
        margin-bottom: 10px;
    }

    .card-name {
        font-size: 1.1em;
        color: #ddd;
        font-weight: bold;
        margin-bottom: 5px;
    }

    .card-desc {
        font-size: 0.75em;
        color: #888;
        line-height: 1.2;
    }

    /* 针对未开发功能的特殊样式 */
    .disabled-link {
        opacity: 0.5;
        cursor: not-allowed;
        filter: grayscale(100%);
    }
</style>

<div class="nav-full-screen">
    <!-- 头部 -->
    <div class="nav-header-compact">
        <h1 class="nav-title">谜海归巢</h1>
        <p class="nav-subtitle">请选择你的探索方向...</p>
    </div>

    <!-- 导航网格 -->
    <div class="portal-grid-compact">

        <!-- 1. 新月饭店 (已有链接) -->
        <a href="{% url 'main_app:topics' %}" class="portal-card-mini">
            <div class="card-icon">🏮</div>
            <div class="card-name">新月饭店</div>
            <div class="card-desc">稻米的秘密接头处</div>
        </a>

        <!-- 2. 九门往事 (预留) -->
        <a href="{% url 'yucun:xilaimian' %}" class="portal-card-mini">
            <div class="card-icon">📜</div>
            <div class="card-name">雨村小记</div>
            <div class="card-desc">喜来眠欢迎您来</div>
        </a>

        <!-- 3. 汪家试炼 (预留) -->
        <a href="{% url 'wang_jia:gutongjing' %}"div class="portal-card-mini">
            <div class="card-icon">⚔️</div>
            <div class="card-name">汪家试炼</div>
            <div class="card-desc">古潼京的白沙漫天</div>
        </a>

        <!-- 4. 终极秘密 (预留) -->
        <a href="{% url 'zhang_jia:gu_lou' %}"div class="portal-card-mini">
            <div class="card-icon">🗝️</div>
            <div class="card-name">张家古楼</div>
            <div class="card-desc">权限不足</div>
        </a>

    </div>

    <div class="special-portal">
        <a href="{% url 'nanbudangan:index' %}" class="special-card">
            <span class="special-icon">🗂️</span>
            <span class="special-copy">
                <span class="special-name">南部档案 · 特别篇</span>
                <span class="special-desc">一份尚未解封的南方记录</span>
            </span>
        </a>
    </div>
</div>

{% endblock content %}
