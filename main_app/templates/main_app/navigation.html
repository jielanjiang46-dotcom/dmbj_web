{% extends "main_app/base.html" %}

{% block content %}

<style>
    /* 强制页面高度为视口高度，禁止出现滚动条 */
    .nav-full-screen {
        min-height: 60vh;

        display: flex;
        flex-direction: column;
        justify-content: flex-start; /* 保持靠上对齐 */
        padding-top: 120px;          /* 保持你刚才调整好的顶部距离 */
        align-items: center;
        max-width: 1200px;
        margin: 0 auto;
    }

    /* 头部区域更紧凑 */
    .nav-header-compact {
        text-align: center;
        margin-bottom: 40px; /* 减小下边距 */
    }

    .nav-title {
        font-size: 2.2em;
        color: #e0e0e0;
        margin: 0 0 5px 0;
        letter-spacing: 2px;
    }

    .nav-subtitle {
        font-size: 0.9em;
        color: #666;
        margin: 0;
    }

    /* 网格布局：在大屏幕上横向排列 */
    .portal-grid-compact {
        display: grid;
        grid-template-columns: repeat(4, 1fr); /* 强制分为4列 */
        gap: 30px;
        width: 100%;
    }

    /* 如果屏幕太窄（比如手机），自动变为2x2的矩阵 */
    @media (max-width: 900px) {
        .portal-grid-compact {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    /* 单个卡片样式：更小巧 */
    .portal-card-mini {
        background: rgba(30, 30, 30, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 25px 15px;
        text-align: center;
        transition: all 0.3s ease;
        cursor: pointer;
        text-decoration: none; /* 去掉链接下划线 */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    .portal-card-mini:hover {
        background: rgba(50, 50, 50, 0.8);
        transform: translateY(-5px);
        border-color: #d4af37; /* 金色边框高亮 */
        box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }

    .card-icon {
        font-size: 2.5em;
        margin-bottom: 10px;
    }

    .card-name {
        font-size: 1.1em;
        color: #ddd;
        font-weight: bold;
        margin-bottom: 5px;
    }

    .card-desc {
        font-size: 0.75em;
        color: #888;
        line-height: 1.2;
    }

    /* 针对未开发功能的特殊样式 */
    .disabled-link {
        opacity: 0.5;
        cursor: not-allowed;
        filter: grayscale(100%);
    }
</style>

<div class="nav-full-screen">
    <!-- 头部 -->
    <div class="nav-header-compact">
        <h1 class="nav-title">谜海归巢</h1>
        <p class="nav-subtitle">请选择你的探索方向...</p>
    </div>

    <!-- 导航网格 -->
    <div class="portal-grid-compact">

        <!-- 1. 新月饭店 (已有链接) -->
        <a href="{% url 'main_app:topics' %}" class="portal-card-mini">
            <div class="card-icon">🏮</div>
            <div class="card-name">新月饭店</div>
            <div class="card-desc">稻米的秘密接头处</div>
        </a>

        <!-- 2. 九门往事 (预留) -->
        <div class="portal-card-mini disabled-link">
            <div class="card-icon">📜</div>
            <div class="card-name">九门往事</div>
            <div class="card-desc">历史档案解密中...</div>
        </div>

        <!-- 3. 汪家试炼 (预留) -->
        <a href="{% url 'wang_jia:gutongjing' %}"div class="portal-card-mini">
            <div class="card-icon">⚔️</div>
            <div class="card-name">汪家试炼</div>
            <div class="card-desc">古潼京的白沙漫天</div>
        </a>

        <!-- 4. 终极秘密 (预留) -->
        <a href="{% url 'zhang_jia:memory' %}"div class="portal-card-mini">
            <div class="card-icon">🗝️</div>
            <div class="card-name">张家古楼</div>
            <div class="card-desc">权限不足</div>
        </a>

    </div>
</div>

{% endblock content %}
