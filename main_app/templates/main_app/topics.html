{% extends 'main_app/base.html' %}

{% block content %}

  <p>Topics</p>

  <ul>
    {% for topic in topics %}
       <li>
        <a href="{% url 'main_app:topic' topic.id %}">
          {{ topic.text }}</a>
      </li>
    {% empty %}
       <li>No topics have been added yet.</li>
    {% endfor %}
  </ul>

  <a href="{% url 'main_app:new_topic' %}">增加一个主题</a>

{% endblock content %}
