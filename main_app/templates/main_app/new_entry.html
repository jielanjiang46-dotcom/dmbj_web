{% extends "main_app/base.html" %}

{% block content %}

<!-- ================= 页面专用 CSS ================= -->
<style>
    /* ... 保留你原来的 .new-entry-wrapper 和 .entry-card 样式 ... */
    .new-entry-wrapper { max-width: 800px !important; margin: 50px auto !important; padding: 20px; box-sizing: border-box; }
    .entry-card { background-color: #ffffff !important; border-radius: 12px !important; padding: 40px !important; box-shadow: 0 10px 25px rgba(0,0,0,0.1) !important; color: #333; }
    .page-header { text-align: center; margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
    .page-title { font-size: 1.8em; color: #2c3e50; margin: 0 0 10px 0; font-weight: bold; }
    .back-link { color: #666; text-decoration: none; font-size: 0.9em; transition: color 0.2s; }
    .back-link:hover { color: #4CAF50; }

    /* 【新增】美化报错信息 */
    ul.errorlist {
        list-style: none;
        padding: 0;
        margin: 0 0 15px 0;
        color: #d9534f;
        background: #fdf7f7;
        border: 1px solid #ebccd1;
        padding: 10px;
        border-radius: 4px;
        font-size: 0.9em;
    }

    /* 表单容器 */
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }

    /* 输入框通用样式 */
    textarea, input[type="file"] {
        width: 100% !important;
        padding: 12px !important;
        border: 1px solid #ddd !important;
        border-radius: 6px !important;
        font-size: 1em;
        box-sizing: border-box;
    }
    textarea:focus { border-color: #4CAF50 !important; outline: none; }

    /* 表情包工具栏 */
    .emoji-toolbar {
        margin-bottom: 5px;
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
    }
    .emoji-btn {
        background: #f0f0f0;
        border: 1px solid #ccc;
        border-radius: 4px;
        cursor: pointer;
        padding: 5px 10px;
        font-size: 1.2em;
        transition: background 0.2s;
    }
    .emoji-btn:hover { background: #e0e0e0; }

    /* 提交按钮 */
    .submit-btn {
        display: block; width: 100%; background-color: #4CAF50; color: white;
        padding: 12px; border: none; border-radius: 6px; font-size: 1.1em;
        cursor: pointer; transition: background-color 0.2s; margin-top: 20px;
    }
    .submit-btn:hover { background-color: #45a049; }
</style>

<div class="new-entry-wrapper">
    <div class="entry-card">

        <div class="page-header">
            <h1 class="page-title">添加新笔记</h1>
            <p style="margin:0;">
                当前主题：<a href="{% url 'main_app:topic' topic.id %}" class="back-link">{{ topic.text }}</a>
            </p>
        </div>

        <!-- 【重要】上传文件必须加 enctype="multipart/form-data" -->
        <form action="{% url 'main_app:new_entry' topic.id %}" method='post' enctype="multipart/form-data">
            {% csrf_token %}

            <!-- 1. 文本输入区域 -->
            <div class="form-group">
                <!-- 简单的表情包工具栏 -->
                <div class="emoji-toolbar">
                    <button type="button" class="emoji-btn" onclick="addEmoji('😀')">😀</button>
                    <button type="button" class="emoji-btn" onclick="addEmoji('😂')">😂</button>
                    <button type="button" class="emoji-btn" onclick="addEmoji('🤔')">🤔</button>
                    <button type="button" class="emoji-btn" onclick="addEmoji('👍')">👍</button>
                    <button type="button" class="emoji-btn" onclick="addEmoji('❤️')">❤️</button>
                    <button type="button" class="emoji-btn" onclick="addEmoji('🎉')">🎉</button>
                </div>

                <!-- 直接渲染 text 字段，不再用 as_p -->
                {{ form.text }}
                <!-- 显示 text 字段的特定报错 -->
                {% if form.text.errors %}
                    {{ form.text.errors }}
                {% endif %}
            </div>

            <!-- 2. 图片上传区域 -->
            <div class="form-group">
                <label for="{{ form.image.id_for_label }}">上传图片 (可选)</label>
                {{ form.image }}
                {% if form.image.errors %}
                    {{ form.image.errors }}
                {% endif %}
                <small class="helptext">支持 jpg, png 格式</small>
            </div>

            <button type="submit" class="submit-btn">保存笔记</button>
        </form>

    </div>
</div>

<script>
    // 简单的 JS：点击表情按钮，将表情插入到文本框光标处
    function addEmoji(emoji) {
        var textarea = document.getElementById('{{ form.text.id_for_label }}');
        var startPos = textarea.selectionStart;
        var endPos = textarea.selectionEnd;
        textarea.value = textarea.value.substring(0, startPos)
            + emoji
            + textarea.value.substring(endPos, textarea.value.length);
        textarea.focus();
        textarea.selectionEnd = startPos + emoji.length;
    }
</script>

{% endblock content %}
