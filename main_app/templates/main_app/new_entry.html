{% extends "main_app/base.html" %}

{% block content %}

<!-- ================= 页面专用 CSS (强制覆盖 base.html) ================= -->
<style>
    /* 1. 外层容器：居中并留出呼吸感 */
    .new-entry-wrapper {
        max-width: 800px !important;
        margin: 50px auto !important;
        padding: 20px;
        box-sizing: border-box;
    }

    /* 2. 核心卡片样式：白底、圆角、阴影 */
    .entry-card {
        background-color: #ffffff !important;
        border-radius: 12px !important;
        padding: 40px !important;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1) !important; /* 更高级的阴影 */
        color: #333;
    }

    /* 3. 标题区域美化 */
    .page-header {
        text-align: center;
        margin-bottom: 30px;
        border-bottom: 1px solid #eee;
        padding-bottom: 20px;
    }

    .page-title {
        font-size: 1.8em;
        color: #2c3e50;
        margin: 0 0 10px 0;
        font-weight: bold;
    }

    .back-link {
        color: #666;
        text-decoration: none;
        font-size: 0.9em;
        transition: color 0.2s;
    }
    .back-link:hover {
        color: #4CAF50; /* 悬停变绿 */
    }

    /* 4. 表单样式优化 (对抗 Django 默认样式) */
    form p {
        margin-bottom: 20px;
    }

    /* 针对 Django 生成的 label */
    form label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #555;
    }

    /* 针对 Django 生成的 input/textarea */
    form input[type="text"],
    form textarea,
    form select {
        width: 100% !important;
        padding: 12px !important;
        border: 1px solid #ddd !important;
        border-radius: 6px !important;
        font-size: 1em;
        box-sizing: border-box; /* 防止宽度溢出 */
        transition: border-color 0.3s;
    }

    /* 输入框聚焦效果 */
    form input:focus,
    form textarea:focus {
        border-color: #4CAF50 !important;
        outline: none;
        box-shadow: 0 0 5px rgba(76, 175, 80, 0.2);
    }

    /* 帮助文本 (Help text) */
    .helptext {
        display: block;
        font-size: 0.8em;
        color: #888;
        margin-top: 5px;
    }

    /* 5. 提交按钮美化 */
    .submit-btn {
        display: block;
        width: 100%;
        background-color: #4CAF50;
        color: white;
        padding: 12px;
        border: none;
        border-radius: 6px;
        font-size: 1.1em;
        cursor: pointer;
        transition: background-color 0.2s;
        margin-top: 10px;
    }

    .submit-btn:hover {
        background-color: #45a049;
    }
</style>

<div class="new-entry-wrapper">
    <div class="entry-card">

        <!-- 头部：标题 + 返回链接 -->
        <div class="page-header">
            <h1 class="page-title">添加新笔记</h1>
            <p style="margin:0;">
                当前主题：<a href="{% url 'main_app:topic' topic.id %}" class="back-link">{{ topic.text }}</a>
            </p>
        </div>

        <!-- 表单区域 -->
        <form action="{% url 'main_app:new_entry' topic.id %}" method='post'>
            {% csrf_token %}

            <!-- 这里直接渲染表单，CSS 会自动美化它 -->
            {{ form.as_p }}

            <button type="submit" class="submit-btn">保存笔记</button>
        </form>

    </div>
</div>

{% endblock content %}
