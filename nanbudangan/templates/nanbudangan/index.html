{% extends "main_app/base.html" %}

<style>
.main-container{padding:0}.game{position:relative;width:100%;height:calc(100vh - 62px);min-height:620px;overflow:hidden;background:#11191b;color:#eeeae0;font-family:"Microsoft YaHei",sans-serif}#gameCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}.shade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle,transparent 42%,rgba(5,10,12,.48) 115%)}

@media(max-width:700px){.game{height:calc(100vh - 55px);min-height:540px}.chapter{top:18px;left:18px}.decks{right:12px;top:18%;width:175px}.hint{display:none}}
</style>
<section class="game" id="game"><canvas id="gameCanvas" tabindex="0"></canvas><div class="shade"></div><div class="chapter"><small>南部档案 · 特别篇</small><strong id="chapterTitle">第一幕　登 船</strong></div><a class="graybox-entry" href="{% url 'nanbudangan:graybox' %}">开场灰盒验收 →</a><p class="caption" id="caption"></p><button class="action" id="action" type="button"></button><aside class="dialogue" id="dialogue"><span class="speaker" id="speaker">水手</span><p id="dialogueText"></p><button id="dialogueNext" type="button">继续 ›</button></aside><nav class="decks" id="decks"><h3>水手的船内导览</h3><button data-zone="third">三等舱 · 船头船尾</button><button data-zone="second">二等舱 · 中层走廊</button><button data-zone="first">头等舱 · 中央建筑</button></nav><aside class="analysis" id="analysis"><h3>张海盐 · 疫病推演</h3><p>可能一：在船上染病，被控制到离船后才发作。</p><p>可能二：有人在离船时，精确选择底层商人传播。</p><p><strong>底舱里有一个熟络、善于搭话的人。</strong></p><p><strong>首要嫌疑：船医。</strong>他有药物、有情报，也能控制发病时间。</p><p class="deadline">距离开船：三天</p></aside><span class="hint" id="hint">拖动鼠标环视</span><div class="loading" id="loading">正在进入马六甲外港</div></section>

<script type="module">
import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{clone as cloneSkeleton}from'three/addons/utils/SkeletonUtils.js';
const root=document.getElementById('game'),canvas=document.getElementById('gameCanvas'),caption=document.getElementById('caption'),action=document.getElementById('action'),dialogue=document.getElementById('dialogue'),speaker=document.getElementById('speaker'),dialogueText=document.getElementById('dialogueText'),dialogueNext=document.getElementById('dialogueNext'),decks=document.getElementById('decks'),analysis=document.getElementById('analysis'),loading=document.getElementById('loading'),hint=document.getElementById('hint');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.setSize(root.clientWidth,root.clientHeight,false);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.18;renderer.shadowMap.enabled=true;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x77868a);scene.fog=new THREE.Fog(0x77868a,95,260);const camera=new THREE.PerspectiveCamera(58,root.clientWidth/root.clientHeight,.1,500);camera.rotation.order='YXZ';camera.position.set(0,1.72,36);scene.add(camera);

scene.add(new THREE.HemisphereLight(0xe7efeb,0x263237,2.8));const sun=new THREE.DirectionalLight(0xffefd2,4.2);sun.position.set(-50,80,45);sun.castShadow=true;scene.add(sun);const warm=new THREE.PointLight(0xffaa62,22,22);warm.visible=false;scene.add(warm);

const harbourPeople=[],attendants=[],characterMixers=[];let sailor=null,arm=null,armBones={};const clothPalette=[0x51463a,0x38464a,0x5a513f,0x3f4938,0x4b3d38,0x34434f,0x625846,0x3e4b46];
function stylePerson(person,role,index=0){person.traverse(o=>{if(!o.isMesh)return;o.castShadow=true;o.receiveShadow=true;const mats=Array.isArray(o.material)?o.material:[o.material];const copies=mats.map(m=>{const c=m.clone();if(c.name.includes('sailor navy'))c.color.set(role==='attendant'?0x596052:clothPalette[index%clothPalette.length]);if(c.name.includes('uniform brass')&&role!=='sailor')c.color.set(0x3e352b);return c});o.material=Array.isArray(o.material)?copies:copies[0];if(role!=='sailor'&&['Sailor_Cap','Sailor_CapBand','Epaulette_L','Epaulette_R','Sailor_Collar_L','Sailor_Collar_R'].includes(o.name))o.visible=false});if(role==='queue'){person.scale.x*=.92+(index%4)*.035;person.scale.y*=.93+(index%3)*.04}}

function buildHarbourCast(gltf){const source=gltf.scene,clip=gltf.animations.find(a=>a.name==='Sailor_Idle')||gltf.animations[0],animate=p=>{if(!clip)return;const mixer=new THREE.AnimationMixer(p);mixer.clipAction(clip).play();mixer.setTime(Math.random()*1.8);characterMixers.push(mixer)};const queue=[[-2.4,30,.98],[1.8,27,1.04],[-1.3,24,.94],[2.2,21,1.02],[-2.1,18,1.05],[1.1,15,.96],[-1.8,12,1.01],[2.4,9,.95]];queue.forEach((p,i)=>{const person=placePerson(source,...p,'queue',i);person.rotation.y=Math.PI+(i%3-1)*.08;animate(person)});animate(placePerson(source,-1.35,42,1.02,'attendant',0));animate(placePerson(source,1.25,42.6,.97,'attendant',1));sailor=placePerson(source,.15,32.8,1.02,'sailor');sailor.visible=false;animate(sailor)}
let ship,interiors,mode='exterior',state='arrival',currentZone=null,yaw=0,targetYaw=0,pitch=-.08,drag=false,lastX=0,lastY=0,keys={},dialogueStep=0,analysisIndex=0;const visited=new Set(),loader=new GLTFLoader();
Promise.all([new Promise((ok,no)=>loader.load('{% url "nanbudangan:ship_model" %}',g=>{ship=g.scene;ship.position.set(-28,-5,-48);scene.add(ship);ok()},undefined,no)),new Promise((ok,no)=>loader.load('{% url "nanbudangan:interiors_model" %}',g=>{interiors=g.scene;interiors.visible=false;scene.add(interiors);ok()},undefined,no)),new Promise((ok,no)=>loader.load('{% url "nanbudangan:people_model" %}',g=>{buildHarbourCast(g);ok()},undefined,no)),new Promise((ok,no)=>loader.load('{% url "nanbudangan:first_person_arms_model" %}',g=>{arm=g.scene;arm.position.set(.15,-.76,-1.15);arm.rotation.set(-.4,Math.PI,.12);arm.scale.setScalar(1.35);arm.visible=false;arm.traverse(o=>{if(o.isMesh){o.frustumCulled=false;o.renderOrder=5}});armBones={upper:arm.getObjectByName('arm_upper.R'),lower:arm.getObjectByName('arm_lower.R'),palm:arm.getObjectByName('palm.R')};camera.add(arm);ok()},undefined,no))]).then(()=>{loading.classList.add('done');say('热浪、汗味和嘈杂的人声挤满了码头。队伍缓慢朝登船口挪动，南安号正进入泊位。',4300);setTimeout(()=>setAction('R','回头看看岸边','turn'),4500)}).catch(e=>{console.error(e);loading.textContent='场景装载失败，请刷新重试'});
function say(text,time=3200){caption.textContent=text;caption.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>caption.classList.remove('show'),time)}function setAction(key,text,next){action.innerHTML=`<span class="key">${key}</span>${text}`;action.dataset.next=next;action.classList.add('show')}
function doAction(){const next=action.dataset.next;if(next==='turn'){targetYaw=Math.PI;action.classList.remove('show');setTimeout(()=>{setAction('点击','向岸边努力招手','wave');say('张瑞朴的两个年轻随从站在人潮后面，默默目送着他。')},1200)}else if(next==='wave'){action.classList.remove('show');setTimeout(()=>{attendants.forEach(p=>p.visible=false);say('两个年轻人几乎在一瞬间消失进了人群。',3200);setTimeout(()=>setAction('R','转回南安号','return'),2600)},650)}else if(next==='return'){targetYaw=0;action.classList.remove('show');if(sailor)sailor.visible=true;setTimeout(()=>showDialogue('水手','您好，张先生。您是张瑞朴先生的侄子吗？我是专门来为您服务的。'),1200)}else if(next==='ticket'){action.classList.remove('show');showDialogue('张海盐 · 心想','有钱真好，到处都有人替你做眼线。')}else if(next==='overview'){action.classList.remove('show');beginOverview()}else if(next==='analysis'){action.classList.remove('show');startAnalysis()}}
action.onclick=doAction;addEventListener('keydown',e=>{if(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();keys[e.code]=true;if((e.code==='KeyR'||e.code==='Enter')&&action.classList.contains('show'))doAction()});addEventListener('keyup',e=>keys[e.code]=false);

const analysisLines=[
 ['张海盐 · 心想','上一次南安号从厦门驶出，沿马六甲去了四个港口。下船的人把瘟疫带往各地，船上却没有暴发。'],

function beginOverview(){mode='overview';harbourPeople.forEach(p=>p.visible=false);dock.visible=false;interiors.visible=false;ship.visible=true;ship.position.set(0,-5,0);camera.position.set(108,57,102);overviewControls.target.set(0,17,0);overviewControls.enabled=true;overviewControls.update();document.getElementById('chapterTitle').textContent='第二幕　南安号全貌';hint.textContent='拖动旋转 · 滚轮缩放';dialogueStep=3;showDialogue('水手','南安号在这条航线上属于绝对的大船。更大的蒸汽锅炉，让它在海上跑得非常快。船分三种舱位，我带您一层一层看。')}

dialogueNext.onclick=()=>{if(mode==='analysis'){analysisIndex++;if(analysisIndex<analysisLines.length)showDialogue(...analysisLines[analysisIndex]);else{dialogue.classList.remove('show');analysis.classList.remove('show');say('新的目标已记录：医务室',4200)}return}dialogue.classList.remove('show');dialogueStep++;if(dialogueStep===1)setAction('点击','递出船票和请帖','ticket');else if(dialogueStep===2){showDialogue('水手','船上就是一个小宇宙。您现在正步向天堂，而下面就是人间。');dialogueStep=2}else if(dialogueStep===3)setAction('点击','听水手介绍南安号全貌','overview');else if(dialogueStep===4){decks.classList.add('show');document.getElementById('chapterTitle').textContent='第三幕　进入船舱';say('点击一种舱位，跟着水手真正走进去。',3600)}};
decks.querySelectorAll('button').forEach(btn=>btn.onclick=()=>enterZone(btn.dataset.zone,btn));function enterZone(zone,btn){mode='interior';currentZone=zone;overviewControls.enabled=false;ship.visible=false;dock.visible=false;water.visible=false;interiors.visible=true;scene.background.set(0x171c1c);scene.fog=new THREE.Fog(0x171c1c,18,65);warm.visible=true;decks.querySelectorAll('button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');const data={third:{pos:[0,1.72,-9],name:'三等舱 · 船头',text:'这里靠近船头和船尾，稳定性最差。三等舱有独立活动区域，通铺、蒸汽管和行李把空间挤得只剩窄路。'},second:{pos:[35,1.72,-9],name:'二等舱 · 中层',text:'二等舱本质上服务于能住头等舱却没买到票的客人，因此和头等舱可以互通。'},first:{pos:[75,1.72,-9],name:'头等舱 · 中央建筑',text:'头等舱占据中央四层建筑。舞厅、游泳池、沙龙、餐厅、露台酒吧和室内球场都在这里；顶部还有舰桥、观景台和发报室。'}}[zone];camera.position.set(...data.pos);yaw=Math.PI;targetYaw=Math.PI;pitch=0;warm.position.copy(camera.position).add(new THREE.Vector3(0,2,1));document.getElementById('chapterTitle').textContent=data.name;showDialogue('水手',data.text);visited.add(zone);canvas.focus();hint.textContent='拖动环视 · W A S D 行走 · 双击锁定鼠标';if(visited.size===3)setTimeout(()=>setAction('点击','整理瘟疫线索','analysis'),4200)}
canvas.addEventListener('pointerdown',e=>{if(mode==='overview')return;drag=true;lastX=e.clientX;lastY=e.clientY;canvas.focus();canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(mode==='overview')return;if(document.pointerLockElement===canvas){yaw-=e.movementX*.0025;targetYaw=yaw;pitch=THREE.MathUtils.clamp(pitch-e.movementY*.0022,-1.1,1.1);return}if(!drag)return;yaw-=(e.clientX-lastX)*.003;targetYaw=yaw;pitch=THREE.MathUtils.clamp(pitch-(e.clientY-lastY)*.0025,-1.1,1.1);lastX=e.clientX;lastY=e.clientY});canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('dblclick',()=>{if(mode==='interior')canvas.requestPointerLock()});
const playerRadius=.38;function blocked(pos){const bounds={third:{x:[-3.7,3.7],z:[-10.1,10.1]},second:{x:[32.7,37.3],z:[-10.8,10.8]},first:{x:[68.9,81.1],z:[-11.7,11.7]}}[currentZone];if(!bounds)return false;if(pos.x<bounds.x[0]+playerRadius||pos.x>bounds.x[1]-playerRadius||pos.z<bounds.z[0]+playerRadius||pos.z>bounds.z[1]-playerRadius)return true;if(currentZone==='third'){for(const z of[-7.5,-3,1.5,6])if(Math.abs(pos.z+z)<2&&Math.abs(pos.x)>2.05)return true;for(const [x,z]of[[.65,5.2],[.65,-3.4]])if(Math.abs(pos.x-x)<1.15&&Math.abs(pos.z-z)<.85)return true}if(currentZone==='first'){for(const z of[-7.2,0,7.2])if(Math.hypot(pos.x-75,pos.z+z)<1.75)return true}return false}function movePlayer(delta){const nextX=camera.position.clone();nextX.x+=delta.x;if(!blocked(nextX))camera.position.x=nextX.x;const nextZ=camera.position.clone();nextZ.z+=delta.z;if(!blocked(nextZ))camera.position.z=nextZ.z}
