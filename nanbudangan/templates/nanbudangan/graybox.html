<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>南部档案 · 开场灰盒</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#899697}*{box-sizing:border-box}.gb{position:fixed;inset:0;width:100vw;height:100vh;min-width:320px;min-height:480px;overflow:hidden;background:#899697;color:#f6f1e7;font-family:"Microsoft YaHei",sans-serif}.gb canvas{position:absolute;z-index:1;inset:0;width:100%;height:100%;display:block;background:#899697}.gb::after{content:"";position:absolute;z-index:2;inset:0;pointer-events:none;background:radial-gradient(circle,transparent 45%,rgba(15,21,22,.32) 120%)}
.gb-head{position:absolute;z-index:4;top:24px;left:28px;text-shadow:0 2px 8px #263031}.gb-head small{display:block;color:#e2e5e1;font-size:10px;letter-spacing:3px}.gb-head strong{display:block;margin-top:7px;font:400 23px "Noto Serif SC","Songti SC",serif;letter-spacing:4px}.gb-head em{display:inline-block;margin-top:10px;padding:4px 7px;background:#d2a84b;color:#202426;font-size:9px;font-style:normal;letter-spacing:2px}.gb-back{position:absolute;z-index:8;right:22px;top:22px;color:#fff;font-size:11px;letter-spacing:2px;text-decoration:none;text-shadow:0 2px 7px #263031}
.gb-caption{position:absolute;z-index:5;left:50%;bottom:13%;width:min(760px,84vw);margin:0;transform:translateX(-50%);text-align:center;font:15px/1.8 "Noto Serif SC","Songti SC",serif;letter-spacing:1px;text-shadow:0 2px 9px #101515}.gb-action{position:absolute;z-index:6;left:50%;bottom:22%;transform:translateX(-50%);padding:12px 18px;border:1px solid #eee8dc;background:rgba(20,27,28,.86);color:#fffaf0;letter-spacing:2px;cursor:pointer}.gb-action[hidden]{display:none}.gb-dialogue{position:absolute;z-index:6;left:50%;bottom:4%;width:min(760px,84vw);transform:translateX(-50%);padding:16px 20px;background:rgba(15,21,22,.92);border-top:1px solid #aeb7b1}.gb-dialogue[hidden]{display:none}.gb-dialogue span{display:block;margin-bottom:7px;color:#c5d0c9;font-size:10px;letter-spacing:4px}.gb-dialogue p{margin:0 90px 0 0;font:14px/1.7 "Noto Serif SC","Songti SC",serif}.gb-dialogue button{position:absolute;right:18px;bottom:15px;padding:7px 12px;border:1px solid #9da8a1;background:transparent;color:#fff;cursor:pointer}.gb-legend{position:absolute;z-index:4;right:22px;bottom:20px;font-size:10px;letter-spacing:2px;color:#f0f3ef;text-shadow:0 2px 7px #263031}
</style>
</head>
<body>
<section class="gb" id="graybox">
  <canvas id="gbCanvas"></canvas>
  <header class="gb-head"><small>南部档案 · 南安号</small><strong>开场灰盒</strong><em>只验收镜头与调度</em></header>
  <a class="gb-back" href="{% url 'nanbudangan:index' %}">返回正式页</a>
  <p class="gb-caption" id="gbCaption">热浪、汗味和嘈杂人声挤满了码头。队伍正缓慢向登船口移动。</p>
  <button class="gb-action" id="gbAction" type="button">点击 · 拿军帽扇风</button>
  <aside class="gb-dialogue" id="gbDialogue" hidden><span id="gbSpeaker"></span><p id="gbText"></p><button id="gbNext" type="button">继续 ›</button></aside>
  <span class="gb-legend">灰色＝人群　黄色＝剧情人物　棕色＝货物</span>
</section>
<script>
(() => {
  const root=document.getElementById('graybox'),canvas=document.getElementById('gbCanvas'),ctx=canvas.getContext('2d'),caption=document.getElementById('gbCaption'),action=document.getElementById('gbAction'),dialogue=document.getElementById('gbDialogue'),speaker=document.getElementById('gbSpeaker'),text=document.getElementById('gbText'),next=document.getElementById('gbNext');
  let width=0,height=0,stage=0,view='forward',armMode='',porterX=-.3,porterRun=false,attendantsVisible=true,sailorX=-.22,sailorWalk=false,walkProgress=0;
  const C={sky:'#899697',dock:'#665949',cargo:'#795332',crowd:'#596363',target:'#d2a84b',ship:'#151c1f',white:'#dedfd8',sailor:'#e3e2d9',shadow:'rgba(18,24,25,.24)'};
  function resize(){const dpr=Math.min(devicePixelRatio||1,2);width=root.clientWidth;height=root.clientHeight;canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);canvas.style.width=width+'px';canvas.style.height=height+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
  function person(x,y,scale,color,front=false){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.fillStyle=C.shadow;ctx.beginPath();ctx.ellipse(0,43,19,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=color;ctx.fillRect(-12,-7,24,45);ctx.beginPath();ctx.arc(0,-17,11,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#303638';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-7,38);ctx.lineTo(-9,62);ctx.moveTo(7,38);ctx.lineTo(9,62);ctx.stroke();if(front){ctx.fillStyle='#252a2b';ctx.fillRect(-5,-19,3,2);ctx.fillRect(3,-19,3,2)}ctx.restore()}
  function cargo(x,y,w,h){ctx.fillStyle=C.cargo;ctx.strokeStyle='#3d2a1b';ctx.lineWidth=2;ctx.fillRect(x-w/2,y-h,w,h);ctx.strokeRect(x-w/2,y-h,w,h);ctx.beginPath();ctx.moveTo(x-w/2,y-h);ctx.lineTo(x+w/2,y);ctx.moveTo(x+w/2,y-h);ctx.lineTo(x-w/2,y);ctx.stroke()}
  function drawDock(){const horizon=height*.44;ctx.fillStyle=C.sky;ctx.fillRect(0,0,width,height);ctx.fillStyle='#aab3b0';ctx.fillRect(0,horizon-8,width,8);ctx.fillStyle=C.dock;ctx.beginPath();ctx.moveTo(width*.23,horizon);ctx.lineTo(width*.77,horizon);ctx.lineTo(width,height);ctx.lineTo(0,height);ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(45,38,31,.38)';ctx.lineWidth=2;for(let i=0;i<11;i++){const y=horizon+(height-horizon)*i/10;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(width,y);ctx.stroke()}for(let i=-6;i<=6;i++){ctx.beginPath();ctx.moveTo(width*.5+i*19,horizon);ctx.lineTo(width*.5+i*130,height);ctx.stroke()}}
  function drawShip(){const h=height*.44;ctx.fillStyle=C.ship;ctx.beginPath();ctx.moveTo(0,h*.5);ctx.lineTo(width*.57,h*.63);ctx.lineTo(width*.52,h);ctx.lineTo(0,h);ctx.closePath();ctx.fill();ctx.fillStyle=C.white;ctx.fillRect(0,h*.35,width*.48,h*.22);ctx.fillStyle=C.target;for(let i=0;i<4;i++)ctx.fillRect(width*(.08+i*.095),h*.08,34,h*.28);ctx.fillStyle='rgba(40,47,48,.55)';for(let i=0;i<4;i++){ctx.beginPath();ctx.ellipse(width*(.08+i*.095)+17,h*.08,17,6,0,0,Math.PI*2);ctx.fill()}}
  function drawForward(){drawDock();drawShip();const crowd=[[.35,.55,.72],[.46,.59,.82],[.57,.56,.73],[.66,.61,.86],[.29,.66,.95],[.53,.7,1.05],[.71,.69,.96],[.4,.75,1.1]];crowd.forEach(([x,y,s])=>person(width*x,height*y,s,C.crowd));for(let i=0;i<7;i++)cargo(i%2?width*.84:width*.13,height*(.61+i*.055),52+i%3*12,34+i%2*8);if(stage>=5)person(width*(.5+sailorX),height*.64,1.35,C.sailor,true);if(walkProgress>0){ctx.fillStyle='rgba(235,229,215,'+Math.min(walkProgress,.75)+')';ctx.fillRect(0,0,width,height)}}
  function drawBack(){drawDock();for(let i=0;i<12;i++){const side=i%2?1:-1,x=.5+side*(.13+(i%3)*.09),y=.51+(i%6)*.055;person(width*x,height*y,.7+(i%4)*.1,C.crowd)}if(attendantsVisible){person(width*.44,height*.67,1.28,C.target,true);person(width*.56,height*.67,1.28,C.target,true)}if(porterRun){person(width*(.5+porterX),height*.66,1.2,C.crowd);cargo(width*(.5+porterX),height*.58,150,75)}}
  function drawArm(){if(!armMode)return;ctx.save();ctx.translate(width*.77,height*.86);ctx.rotate(armMode==='wave'?-.42:-.72);ctx.fillStyle=C.target;ctx.fillRect(-22,-120,44,135);ctx.beginPath();if(ctx.roundRect)ctx.roundRect(-31,-160,62,56,18);else ctx.rect(-31,-160,62,56);ctx.fill();if(armMode==='wave'){ctx.strokeStyle=C.target;ctx.lineWidth=10;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*11,-150);ctx.lineTo(i*14,-198-Math.abs(i)*5);ctx.stroke()}}ctx.restore()}
  function draw(){ctx.clearRect(0,0,width,height);if(view==='back')drawBack();else drawForward();drawArm();requestAnimationFrame(draw)}
  function prompt(label){action.textContent=label;action.hidden=false}function say(who,line){speaker.textContent=who;text.textContent=line;dialogue.hidden=false}function hideDialogue(){dialogue.hidden=true}
  action.onclick=()=>{action.hidden=true;if(stage===0){stage=1;armMode='fan';caption.textContent='军装早已湿透。张海盐拿军帽扇了几下，风却又停了。';setTimeout(()=>{armMode='';prompt('点击 · 仰望南安号')},1200)}else if(stage===1){stage=2;caption.textContent='黑色船体和四根烟囱压住大半天空。这个世界已经和初到南洋时完全不同。';setTimeout(()=>prompt('[ R ] 回头'),2200)}else if(stage===2){stage=3;view='back';caption.textContent='两名年轻随从没有上船，只站在人流后默默目送。';setTimeout(()=>prompt('一次点击招手'),700)}else if(stage===3){stage=4;armMode='wave';caption.textContent='张海盐努力挥手，装作他们是前来送别的亲眷。';setTimeout(()=>{armMode='';porterRun=true},850)}else if(stage===4){stage=5;view='forward';caption.textContent='他稍微松了一口气，一转头——';sailorWalk=true}else if(stage===5){stage=6;caption.textContent='水手反复核对船票与请帖。';say('张海盐 · 心想','有钱真好，到处都有人替你做眼线，帮你办事。')}else if(stage===6){stage=7;hideDialogue();caption.textContent='水手侧身让开，贵宾通道就在拥挤人潮的一侧。';const timer=setInterval(()=>{walkProgress+=.025;if(walkProgress>=1)clearInterval(timer)},30)}};
  next.onclick=()=>{hideDialogue();if(stage===5)prompt('点击 · 递出船票和请帖');else if(stage===6)prompt('点击 · 跟随水手登船')};addEventListener('keydown',e=>{if(e.code==='KeyR'&&!action.hidden&&action.textContent.includes('R'))action.click()});
  let last=performance.now();function update(now){const dt=Math.min((now-last)/1000,.05);last=now;if(porterRun){porterX+=dt*.39;if(porterX>-.08&&attendantsVisible)attendantsVisible=false;if(porterX>.38){porterRun=false;caption.textContent='货箱经过后，两个人已经消失在人群中。';prompt('[ R ] 转回南安号')}}if(sailorWalk){sailorX+=dt*.11;if(sailorX>=-.035){sailorWalk=false;say('水手','您好，张先生。您是张瑞朴先生的侄子吗？我是专门来为您服务的。')}}requestAnimationFrame(update)}
  resize();draw();requestAnimationFrame(update);addEventListener('resize',resize);
})();
</script>
</body>
</html>
